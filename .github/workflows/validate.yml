name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Verify the bundled go-arch-lint templates against fixtures (tests/go-arch-lint/run.sh)
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      # Without the claude CLI, plugin validate is skipped (set STRICT=1 to make that a failure)
      - run: bash scripts/validate.sh
