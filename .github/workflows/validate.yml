name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 同梱の go-arch-lint テンプレートを fixture で検証する（tests/go-arch-lint/run.sh）
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false"
      # claude CLI が無い環境では plugin validate は skipped になる（STRICT=1 を付けると失敗にする）
      - run: bash scripts/validate.sh
